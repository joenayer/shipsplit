# must match the Cloudflare Workers Builds project name, or every build warns and opens a fixup PR
name = "shipsplit"
main = "src/index.js"
compatibility_date = "2026-01-01"

# D1 provisioned 2026-08-04 (account already hosts the paperlove-* bridges)
[[d1_databases]]
binding = "DB"
database_name = "shipsplit"
database_id = "5939066f-6a75-48c5-8bd2-b0d0f53211d1"

workers_dev = true
preview_urls = false   # one public URL only; preview URLs would bypass the Origin allowlist

# Serve the app itself from this Worker, so page and API share one origin.
# Assets are matched first; anything that is not a file falls through to the Worker, which is how
# /health, /auth/* and /plans/* keep working.
[assets]
directory = "./public"

[observability]
enabled = true

# Object storage for shipment attachments (invoices, labels, packing lists). Blobs never go in D1.
[[r2_buckets]]
binding = "FILES"
bucket_name = "shipsplit-files"
